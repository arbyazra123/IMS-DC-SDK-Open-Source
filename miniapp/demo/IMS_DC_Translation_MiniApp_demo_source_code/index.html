<!--
  Mic usage note: this mini-app calls getUserMedia to detect WHEN the caller is speaking
  (via MINIAPP_RECORD_AUDIO + the SDK's getUserMedia license gate), and on each detected
  utterance sends a ~2s rolling buffer of real captured PCM16 audio in the "voice" EC
  request. It does NOT run speech recognition or translation locally itself — that's the
  EC provider's job. Against the default TestECManager mock the audio is ignored and you
  get canned text back; against the real translate-tflite reference provider
  (../../../translate-tflite/README.md) the same request actually runs on-device
  ASR + MT on that audio. Same mini-app, same request shape, either provider.

  Getting my translated caption to the OTHER caller is a second, separate step: this
  mini-app runs identically on both phones (shouldStartRemoteApp:true), and the two
  instances exchange each side's local translation result over the Application Data
  Channel (ADC) — the same peer-to-peer channel webrtcDC.js/RTCDataChannel exposes to
  any mini-app. The far end's speech is never captured by MY getUserMedia at all
  (it only reaches local input devices) — what I show as "the other person said X" is
  literally a message their mini-app instance sent me over the ADC, not anything my
  local EC mock invented.

  Two SDK-platform quirks this mini-app has to work around (see properties.json + script below):
  1. getUserMedia is only granted if BOTH MINIAPP_CAMERA and MINIAPP_RECORD_AUDIO are declared
     and granted, even for an audio-only request (CTWebChromeClient.onPermissionRequest checks
     both unconditionally) — hence MINIAPP_CAMERA is declared despite never using video.
  2. getUserMedia additionally requires calling the setSystemApiLicense JS API once first
     (api:"getUserMedia") — without it the permission check silently never resolves.
  3. The ADC dcLabel must contain "_<appId>_" (DCMiniUseCase.createAppDataChannel validates
     this) — see APP_ID/DC_LABEL below.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Translate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background: #101014; overflow: hidden; font-family: sans-serif; color: #fff; }
    .stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
    .header {
      /* The SDK always overlays a ~50dp-tall capsule (back/settings/close) at the very top
         of the mini-app view, regardless of windowStyle - clear it instead of colliding. */
      padding: 60px 16px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: #16161c;
    }
    select {
      flex: 1;
      background: #22263a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
    }
    .arrow { color: #9aa0b4; }
    .captions {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.4;
    }
    .bubble .original { opacity: 0.7; font-size: 12px; display: block; margin-bottom: 2px; }
    .bubble.me { align-self: flex-end; background: #4c8bf5; border-bottom-right-radius: 4px; }
    .bubble.other { align-self: flex-start; background: #2b2f42; border-bottom-left-radius: 4px; }
    .footer {
      padding: 16px calc(16px) calc(16px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      background: #16161c;
    }
    .toggle-btn {
      padding: 12px 32px;
      border-radius: 24px;
      border: none;
      background: #4c8bf5;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }
    .toggle-btn.active { background: #e5484d; }
    .status { text-align: center; color: #9aa0b4; font-size: 12px; padding: 6px; }
    .status.error { color: #ff8a80; }
    .mic-level { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 0 0 8px; }
    .mic-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2b2f42;
      transition: background 80ms linear, transform 80ms linear;
    }
    .mic-dot.active { background: #4c8bf5; transform: scale(1.35); }
  </style>
</head>
<body>
<div class="stage">
  <div class="header">
    <select id="myLanguage"></select>
    <span class="arrow">↔</span>
    <select id="otherLanguage"></select>
  </div>
  <div class="status" id="status">connecting to translation capability…</div>
  <div class="mic-level" id="micLevel">
    <span class="mic-dot"></span><span class="mic-dot"></span><span class="mic-dot"></span><span class="mic-dot"></span><span class="mic-dot"></span>
  </div>
  <div class="captions" id="captions"></div>
  <div class="footer">
    <button class="toggle-btn" id="toggleBtn">Start translating</button>
  </div>
</div>

<script src="./webrtcDC.js"></script>
<script>
  var dsBridge = window.dsBridge;

  var APP_ID = "602"; // must match properties.json appId
  var DC_LABEL = "local_" + APP_ID + "_1_translate"; // must contain "_<appId>_"

  var translating = false;
  var myLanguage = "Indonesian";
  var otherLanguage = "English";

  var statusEl = document.getElementById("status");
  var captionsEl = document.getElementById("captions");
  var micDots = document.querySelectorAll("#micLevel .mic-dot");

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.classList.toggle("error", !!isError);
  }

  function setMicLevel(rms) {
    // Loud, clear speech is roughly rms 0.15-0.3 on this scale; scale so a normal
    // speaking voice lights most of the dots rather than needing to shout.
    var activeCount = Math.max(0, Math.min(micDots.length, Math.round((rms / 0.25) * micDots.length)));
    micDots.forEach(function (dot, i) {
      dot.classList.toggle("active", i < activeCount);
    });
  }
  var toggleBtn = document.getElementById("toggleBtn");
  var myLangSelect = document.getElementById("myLanguage");
  var otherLangSelect = document.getElementById("otherLanguage");

  function ecRequest(module, func, data) {
    dsBridge.call("async", {
      event: "ECEvent",
      function: "expandingCapacityRequest",
      params: { provider: "OEM", module: module, func: func, data: data || {} }
    }, function () {});
  }

  function renderLanguageOptions(list) {
    [myLangSelect, otherLangSelect].forEach(function (select) {
      select.innerHTML = "";
      list.forEach(function (lang) {
        var opt = document.createElement("option");
        opt.value = lang;
        opt.textContent = lang;
        select.appendChild(opt);
      });
    });
    myLangSelect.value = myLanguage;
    otherLangSelect.value = otherLanguage;
  }

  function pushSetLanguage() {
    ecRequest("Translate", "setLanguage", { myLanguage: myLanguage, otherLanguage: otherLanguage });
  }

  myLangSelect.addEventListener("change", function () {
    myLanguage = myLangSelect.value;
    pushSetLanguage();
  });
  otherLangSelect.addEventListener("change", function () {
    otherLanguage = otherLangSelect.value;
    pushSetLanguage();
  });

  function addBubble(kind, original, translated) {
    var bubble = document.createElement("div");
    bubble.className = "bubble " + kind;
    bubble.innerHTML = "<span class=\"original\">" + original + "</span>" + translated;
    captionsEl.appendChild(bubble);
    captionsEl.scrollTop = captionsEl.scrollHeight;
  }

  // --- ADC: peer-to-peer channel to the SAME mini-app running on the other caller's phone ---
  var pc = null;
  var dc = null;
  var peerReady = false;

  function openPeerChannel() {
    if (dc) return;
    pc = new RTCPeerConnection();
    var xml = "<DataChannelAppInfo><DataChannelApp appId=\"" + APP_ID + "\">" +
      "<DataChannel dcId=\"1\"><DcLabel>" + DC_LABEL + "</DcLabel><Subprotocol></Subprotocol>" +
      "<Ordered>1</Ordered><MaxRetr>0</MaxRetr><MaxTime>0</MaxTime><Priority></Priority>" +
      "<UseCase>1</UseCase><AutoAcceptDcSetup>0</AutoAcceptDcSetup><Bandwidth>500</Bandwidth>" +
      "<QosHint>loss=0.0002;latency=600</QosHint></DataChannel></DataChannelApp></DataChannelAppInfo>";
    dc = pc.createDataChannel(xml, null);
    dc.onopen = function () {
      peerReady = true;
      setStatus("connected to peer · listening");
    };
    dc.onclose = function () {
      peerReady = false;
    };
    dc.onmessage = function (event) {
      // event.data is an ArrayBuffer (see webrtcDC.js RTCDataChannel#channelMessageNotify)
      try {
        var text = new TextDecoder().decode(event.data);
        var msg = JSON.parse(text);
        addBubble("other", msg.original, msg.translated);
      } catch (e) {}
    };
  }

  function closePeerChannel() {
    if (dc) { dc.close(); dc = null; }
    pc = null;
    peerReady = false;
  }

  function sendMyUtteranceToPeer(original, translated) {
    if (!dc || !peerReady) return;
    var bytes = new TextEncoder().encode(JSON.stringify({ original: original, translated: translated }));
    dc.send(bytes);
  }

  // --- Mic-based "I'm speaking" detection + utterance capture ---
  // Detection is mock-agnostic; the captured audio is what makes this mini-app work
  // unmodified against BOTH the TestECManager mock (which ignores it) and a real
  // provider like translate-tflite (which needs it) — see that module's README.
  var audioCtx = null;
  var micStream = null;
  var analyser = null;
  var scriptProcessor = null;
  var silentGain = null;
  var ringBuffer = null;
  var ringWriteIndex = 0;
  var RING_SECONDS = 2;
  var TARGET_SAMPLE_RATE = 16000;
  var micRafId = null;
  var lastVoiceTriggerAt = 0;
  var VOICE_TRIGGER_COOLDOWN_MS = 1500;
  var VOICE_VOLUME_THRESHOLD = 0.05; // RMS on a 0..1 scale; tune per device mic sensitivity

  function resampleLinear(samples, fromRate, toRate) {
    if (fromRate === toRate) return samples;
    var ratio = fromRate / toRate;
    var newLength = Math.round(samples.length / ratio);
    var result = new Float32Array(newLength);
    for (var i = 0; i < newLength; i++) {
      var srcIndex = i * ratio;
      var i0 = Math.floor(srcIndex);
      var i1 = Math.min(i0 + 1, samples.length - 1);
      var frac = srcIndex - i0;
      result[i] = samples[i0] * (1 - frac) + samples[i1] * frac;
    }
    return result;
  }

  function floatTo16BitPCM(floatSamples) {
    var bytes = new Uint8Array(floatSamples.length * 2);
    var view = new DataView(bytes.buffer);
    for (var i = 0; i < floatSamples.length; i++) {
      var s = Math.max(-1, Math.min(1, floatSamples[i]));
      view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return bytes;
  }

  function bytesToBase64(bytes) {
    var binary = "";
    var chunkSize = 0x8000;
    for (var i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function captureUtteranceAsBase64() {
    if (!ringBuffer) return null;
    var len = ringBuffer.length;
    var ordered = new Float32Array(len);
    for (var i = 0; i < len; i++) {
      ordered[i] = ringBuffer[(ringWriteIndex + i) % len];
    }
    var resampled = resampleLinear(ordered, audioCtx.sampleRate, TARGET_SAMPLE_RATE);
    return bytesToBase64(floatTo16BitPCM(resampled));
  }

  var micLicenseGranted = false;

  function grantMicLicenseOnce() {
    if (micLicenseGranted) return;
    micLicenseGranted = true;
    // Required once before getUserMedia will resolve at all (see quirk #2 in the header comment).
    // The license string itself isn't actually checked (LicenseManager.verifyLicense is stubbed
    // true in this open-source build) — only that this call has happened.
    dsBridge.call("async", {
      event: "MiniAppEvent",
      function: "setSystemApiLicense",
      params: { api: "getUserMedia", license: "local-mock-license" }
    }, function () {});
  }

  function startMicListening() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("mic not available in this WebView", true);
      return;
    }
    grantMicLicenseOnce();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      micStream = stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var source = audioCtx.createMediaStreamSource(stream);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      var volumeData = new Uint8Array(analyser.fftSize);

      // Rolling buffer of raw samples so a detected utterance can be sent whole,
      // not just "a threshold crossing happened".
      ringBuffer = new Float32Array(Math.floor(audioCtx.sampleRate * RING_SECONDS));
      ringWriteIndex = 0;
      scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
      source.connect(scriptProcessor);
      // ScriptProcessorNode only fires onaudioprocess while connected to a destination;
      // route through a silent gain so we don't play the mic back out loud.
      silentGain = audioCtx.createGain();
      silentGain.gain.value = 0;
      scriptProcessor.connect(silentGain);
      silentGain.connect(audioCtx.destination);
      scriptProcessor.onaudioprocess = function (e) {
        var input = e.inputBuffer.getChannelData(0);
        for (var i = 0; i < input.length; i++) {
          ringBuffer[ringWriteIndex] = input[i];
          ringWriteIndex = (ringWriteIndex + 1) % ringBuffer.length;
        }
      };

      function tick() {
        if (!analyser) return;
        analyser.getByteTimeDomainData(volumeData);
        var sumSquares = 0;
        for (var i = 0; i < volumeData.length; i++) {
          var v = (volumeData[i] - 128) / 128;
          sumSquares += v * v;
        }
        var rms = Math.sqrt(sumSquares / volumeData.length);
        setMicLevel(rms);
        var now = Date.now();
        if (rms > VOICE_VOLUME_THRESHOLD && now - lastVoiceTriggerAt > VOICE_TRIGGER_COOLDOWN_MS) {
          lastVoiceTriggerAt = now;
          var audioBase64 = captureUtteranceAsBase64();
          ecRequest("Translate", "voice", audioBase64 ? { audio: audioBase64, sampleRate: TARGET_SAMPLE_RATE } : {});
        }
        micRafId = requestAnimationFrame(tick);
      }
      tick();
    }).catch(function () {
      setStatus("mic permission denied", true);
    });
  }

  function stopMicListening() {
    if (micRafId) { cancelAnimationFrame(micRafId); micRafId = null; }
    if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor.onaudioprocess = null; scriptProcessor = null; }
    if (silentGain) { silentGain.disconnect(); silentGain = null; }
    if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    analyser = null;
    ringBuffer = null;
    setMicLevel(0);
  }

  toggleBtn.addEventListener("click", function () {
    translating = !translating;
    toggleBtn.textContent = translating ? "Stop translating" : "Start translating";
    toggleBtn.classList.toggle("active", translating);
    statusEl.textContent = translating ? "connecting to peer…" : "translation stopped";
    ecRequest("Translate", translating ? "start" : "stop", {});
    if (translating) {
      startMicListening();
      openPeerChannel();
    } else {
      stopMicListening();
      closePeerChannel();
    }
  });

  // 接收来自EC能力提供方（当前为本地mock，真实场景为云端AI翻译能力经拓展能力服务转发）的推送
  dsBridge.register("expandingCapacityNotify", function (content) {
    try {
      var payload = JSON.parse(content);
      if (payload.module !== "Translate") return;
      if (payload.func === "languageListCallback") {
        renderLanguageOptions(payload.data.list);
      } else if (payload.func === "translateResultCallback") {
        // myOriginal/myTranslate: 本端麦克风检测到说话、本地EC识别+翻译后的结果。
        // 展示在本端UI的同时，需要通过ADC发给对端，让对端小程序把它显示为"对方说的话"
        addBubble("me", payload.data.myOriginal, payload.data.myTranslate);
        sendMyUtteranceToPeer(payload.data.myOriginal, payload.data.myTranslate);
      } else if (payload.func === "setLanguageCallback") {
        setStatus(translating
          ? (peerReady ? "connected to peer · listening" : "connecting to peer…")
          : payload.data.myLanguage + " ↔ " + payload.data.otherLanguage + " ready");
      } else if (payload.func === "translateErrorCallback") {
        // The active EC provider (e.g. translate-tflite with no model files staged)
        // couldn't produce a result — surface why instead of silently doing nothing.
        setStatus("provider error: " + payload.data.reason, true);
      }
    } catch (e) {}
  });

  dsBridge.call("async", {
    event: "ECEvent",
    function: "expandingCapacityRegister",
    params: { providerModules: ["OEM-Translate"] }
  }, function () {
    setStatus("translation stopped");
    ecRequest("Translate", "languageList", {});
  });
</script>
</body>
</html>
