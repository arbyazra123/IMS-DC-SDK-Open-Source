 textLength="51.2012" x="1097.69" y="822.3417">request</text></g><!--entity S3--><g class="entity" data-qualified-name="S3" data-source-line="208" id="ent0071"><rect fill="#C8E6C9" height="62.9766" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="161.085" x="1080.46" y="970.1883"/><rect fill="#C8E6C9" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1221.545" y="975.1883"/><rect fill="#C8E6C9" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1219.545" y="977.1883"/><rect fill="#C8E6C9" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1219.545" y="981.1883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.085" x="1095.46" y="1003.7234">3. Modem creates</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.7549" x="1095.46" y="1020.2117">data channel</text></g><!--entity S4--><g class="entity" data-qualified-name="S4" data-source-line="209" id="ent0072"><rect fill="#C8E6C9" height="62.9766" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="189.9736" x="893.01" y="1159.9183"/><rect fill="#C8E6C9" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1062.9836" y="1164.9183"/><rect fill="#C8E6C9" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1060.9836" y="1166.9183"/><rect fill="#C8E6C9" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1060.9836" y="1170.9183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.9736" x="908.01" y="1193.4534">4. Cell tower forwards</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.3496" x="908.01" y="1209.9417">to IMS network</text></g><!--entity S5--><g class="entity" data-qualified-name="S5" data-source-line="210" id="ent0073"><rect fill="#C8E6C9" height="62.9766" rx="5" ry="5" style="stroke:#181818;stroke-widt