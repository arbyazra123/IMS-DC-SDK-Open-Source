e="96" id="ent0046"><rect fill="#F1F1F1" height="46.4883" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="153.2852" x="346.36" y="1684.3583"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="479.6452" y="1689.3583"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="477.6452" y="1691.3583"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="477.6452" y="1695.3583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.2852" x="361.36" y="1717.8934">Their 5G Modem</text></g><!--entity SDK2--><g class="entity" data-qualified-name=". .b.HOW IT ACTUALLY WORKS IN YOUR PHONE..b..FRIEND.S PHONE.SDK2" data-source-line="97" id="ent0047"><rect fill="#F1F1F1" height="46.4883" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="106.7119" x="349.64" y="1807.8383"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="436.3519" y="1812.8383"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="434.3519" y="1814.8383"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="434.3519" y="1818.8383"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.7119" x="364.64" y="1841.3734">Their SDK</text></g><!--entity App2--><g class="entity" data-qualified-name=". .b.HOW IT ACTUALLY WORKS IN YOUR PHONE..b..FRIEND.S PHONE.App2" data-source-line="98" id="ent0048"><rect fill="#F1F1F1" height="46.4883" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="140.0986" x="345.95" y="1931.3283"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="466.0486" y="1936.3283"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="464.0486" y="1938.3283"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="464.0486" y="1942.3283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.0986" x="360.95" y="1964.8634">Their Mini App</text></g><g class="entity" data-qualified-name=". .b.KEY TERMS DECODED..b..Terminal.TerminalNote" data-source-line="118" id="ent0060"><path d="M2367.94,158.1083 L2367.94,372.4559 A5,5 0 0 0 2372.94,377.4559 L2619.0572,377.4559 A5,5 0 0 0 2624.0572,372.4559 L2624.0572,163.1083 L2614.0572,153.1083 L2372.94,153.1083 A5,5 0 0 0 2367.94,158.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2614.0572,153.1083 L2614.0572,160.6083 A2.5,2.5 0 0 0 2616.5572,163.1083 L2624.0572,163.1083 L2614.0572,153.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="235.1172" x="2373.94" y="170.6766">Terminal = Your Phone's Hardware</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2373.94" y="185.9872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.8945" x="2373.94" y="201.2977">In telecom language, "terminal"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.5767" x="2373.94" y="216.6083">means the end device (your phone).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2373.94" y="231.9188">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="123.2651" x="2373.94" y="247.2294">Terminal includes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.0781" x="2373.94" y="262.5399">&#8226; Android OS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.6523" x="2373.94" y="277.8505">&#8226; 5G Modem chip</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.9302" x="2373.94" y="293.161">&#8226; IMS client software</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2373.94" y="308.4716">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="126.9023" x="2373.94" y="323.7821">Why we need AIDL:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.8877" x="2373.94" y="339.0927">The modem chip is separate from</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.0273" x="2373.94" y="354.4032">Android, so we use AIDL (Android</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.6045" x="2373.94" y="369.7137">Interface) to talk to it.</text></g><g class="entity" data-qualified-name=". .b.KEY TERMS DECODED..b..IMS .IP Multimedia Subsystem..IMSNote" data-source-line="137" id="ent0062"><path d="M2679.93,158.1083 L2679.93,372.4559 A5,5 0 0 0 2684.93,377.4559 L2917.076,377.4559 A5,5 0 0 0 2922.076,372.4559 L2922.076,163.1083 L2912.076,153.1083 L2684.93,153.1083 A5,5 0 0 0 2679.93,158.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2912.076,153.1083 L2912.076,160.6083 A2.5,2.5 0 0 0 2914.576,163.1083 L2922.076,163.1083 L2912.076,153.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="220.2573" x="2685.93" y="170.6766">IMS = Modern Phone Call System</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2685.93" y="185.9872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.7939" x="2685.93" y="201.2977">Old way: Calls use cellular network</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.3213" x="2685.93" y="216.6083">New way: Calls use 5G internet (IP)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2685.93" y="231.9188">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.4082" x="2685.93" y="247.2294">Benefits:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.1196" x="2685.93" y="262.5399">&#8226; Better quality</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.5972" x="2685.93" y="277.8505">&#8226; Can add data channels</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.4971" x="2685.93" y="293.161">&#8226; Can integrate with apps</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.6426" x="2685.93" y="308.4716">&#8226; Cheaper for operators</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2685.93" y="323.7821">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.2178" x="2685.93" y="339.0927">Standards:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.1162" x="2685.93" y="354.4032">&#8226; 3GPP TS.71 (Data Channel spec)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.146" x="2685.93" y="369.7137">&#8226; 3GPP TS.66 (WebRTC integration)</text></g><g class="entity" data-qualified-name=". .b.KEY TERMS DECODED..b..Data Channel.DCNote" data-source-line="156" id="ent0064"><path d="M2977.5,127.4883 L2977.5,403.0781 A5,5 0 0 0 2982.5,408.0781 L3165.4961,408.0781 A5,5 0 0 0 3170.4961,403.0781 L3170.4961,132.4883 L3160.4961,122.4883 L2982.5,122.4883 A5,5 0 0 0 2977.5,127.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3160.4961,122.4883 L3160.4961,129.9883 A2.5,2.5 0 0 0 3162.9961,132.4883 L3170.4961,132.4883 L3160.4961,122.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171.9961" x="2983.5" y="140.0566">Data Channel = Data Pipe</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2983.5" y="155.3672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.332" x="2983.5" y="170.6777">During a call, you have:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.7847" x="2983.5" y="185.9883">&#8226; Audio stream (voice)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.8325" x="2983.5" y="201.2988">&#8226; Video stream (camera)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.2871" x="2983.5" y="216.6094">&#8226;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="129.0859" x="2994.9004" y="216.6094">Data stream (NEW!)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2983.5" y="231.9199">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="35.1025" x="2983.5" y="247.2305">Uses:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.4653" x="2983.5" y="262.541">&#8226; Send menu selections</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.4824" x="2983.5" y="277.8516">&#8226; Share screen</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.5215" x="2983.5" y="293.1621">&#8226; Play games together</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.6431" x="2983.5" y="308.4727">&#8226; AR/VR data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.6392" x="2983.5" y="323.7832">&#8226; File transfer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.1011" x="2983.5" y="339.0938">&#8226; Real-time translation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2983.5" y="354.4043">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.7803" x="2983.5" y="369.7148">Technology:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.0439" x="2983.5" y="385.0254">Uses WebRTC (same as</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.5498" x="2983.5" y="400.3359">Google Meet, Zoom)</text></g><g class="entity" data-qualified-name=". .b.KEY TERMS DECODED..b..Modem.Chipset.ModemNote" data-source-line="179" id="ent0066"><path d="M3225.97,135.1383 L3225.97,395.4176 A5,5 0 0 0 3230.97,400.4176 L3485.0345,400.4176 A5,5 0 0 0 3490.0345,395.4176 L3490.0345,140.1383 L3480.0345,130.1383 L3230.97,130.1383 A5,5 0 0 0 3225.97,135.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3480.0345,130.1383 L3480.0345,137.6383 A2.5,2.5 0 0 0 3482.5345,140.1383 L3490.0345,140.1383 L3480.0345,130.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.084" x="3231.97" y="147.7066">Modem = 5G Radio Chip</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="3231.97" y="163.0172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.4224" x="3231.97" y="178.3277">Made by companies like:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.2607" x="3231.97" y="193.6383">&#8226; Qualcomm (Snapdragon)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.5703" x="3231.97" y="208.9488">&#8226; MediaTek (Dimensity)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.6455" x="3231.97" y="224.2594">&#8226; Samsung (Exynos)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6563" x="3231.97" y="239.5699">&#8226; HiSilicon (Kirin)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="3231.97" y="254.8805">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="86.3599" x="3231.97" y="270.191">What it does:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.0645" x="3231.97" y="285.5016">1. Converts digital data &#8594; radio waves</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.5986" x="3231.97" y="300.8121">2. Sends to cell tower</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.5713" x="3231.97" y="316.1227">3. Receives from cell tower</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.0645" x="3231.97" y="331.4332">4. Converts radio waves &#8594; digital data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="3231.97" y="346.7437">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.1294" x="3231.97" y="362.0543">Why SDK needs it:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.5742" x="3231.97" y="377.3648">To create data channels, SDK</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.1299" x="3231.97" y="392.6754">must command the modem chip.</text></g><g class="entity" data-qualified-name="FlowTitle" data-source-line="202" id="ent0067"><path d="M793.91,255.8583 L793.91,274.702 A5,5 0 0 0 798.91,279.702 L1065.0975,279.702 A5,5 0 0 0 1070.0975,274.702 L1070.0975,260.8583 L1060.0975,250.8583 L798.91,250.8583 A5,5 0 0 0 793.91,255.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1060.0975,250.8583 L1060.0975,258.3583 A2.5,2.5 0 0 0 1062.5975,260.8583 L1070.0975,260.8583 L1060.0975,250.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="255.1875" x="799.91" y="271.327">&#127919; COMPLETE FLOW SUMMARY</text></g><!--entity S0--><g class="entity" data-qualified-name="S0" data-source-line="205" id="ent0068"><rect fill="#C8E6C9" height="46.4883" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="71.4727" x="1125.26" y="242.0383"/><rect fill="#C8E6C9" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1176.7327" y="247.0383"/><rect fill="#C8E6C9" height="2" style="stroke: