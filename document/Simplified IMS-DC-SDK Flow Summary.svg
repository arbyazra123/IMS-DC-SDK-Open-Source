.6111 164.9602,1832.9698 160.3468,1826.4004 C148.3138,1834.0578 142.1226,1828.267 139.2742,1816.458 C140.131,1815.8152 140.9957,1816.2679 141.1423,1817.2664 C133.9689,1814.668 132.8802,1809.9411 137.6167,1804.1431 C131.4102,1801.9846 131.7285,1797.4313 135.6094,1793.3898 C128.0876,1791.1363 127.7542,1785.7893 132.885,1780.7982 C126.9004,1777.2599 127.0415,1772.2651 132.1214,1768.0633 C126.5453,1762.2617 128.6745,1758.2599 134.9229,1754.9928 C130.1325,1750.418 130.5526,1746.6982 136.3967,1743.4854 C131.1152,1738.3851 132.6287,1732.5653 139.4562,1730.2679 C130.8285,1721.2992 135.4686,1712.7848 146.2742,1710.5283 C146.8967,1710.4358 147.3686,1710.8283 147.0521,1711.493" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="69.6924" x="194.2317" y="1731.0634">&#171;network&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.4951" x="146.2742" y="1747.5517">5G Towers &amp;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.9824" x="146.2742" y="1764.04">IMS Core Network</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="146.2742" y="1780.5283">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.1611" x="146.2742" y="1797.0166">Routes your call and</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.6074" x="146.2742" y="1813.5048">data to the other person</text></g><g class="entity" data-qualified-name=".. 5G NETWORK.n.The Internet Infrastructure..GMN19" data-source-line="71" id="ent0020"><path d="M100.6042,1930.9583 L100.6042,2017.8216 A7.5,7.5 0 0 0 108.1042,2025.3216 L330.0515,2025.3216 A7.5,7.5 0 0 0 337.5515,2017.8216 L337.5515,1933.4583 L327.5515,1923.4583 L225.5142,1923.4583 L225.9642,1831.8483 L217.5142,1923.4583 L108.1042,1923.4583 A7.5,7.5 0 0 0 100.6042,1930.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M327.5515,1923.4583 L327.5515,1929.7083 A3.75,3.75 0 0 0 331.3015,1933.4583 L337.5515,1933.4583 L327.5515,1923.4583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="205.4292" x="106.6042" y="1941.0266">IMS (IP Multimedia Subsystem)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.6328" x="106.6042" y="1956.3372">is the technology that handles</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.9473" x="106.6042" y="1971.6477">voice/video calls over 5G internet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="106.6042" y="1986.9583">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.1221" x="106.6042" y="2002.2688">This SDK adds DATA CHANNELS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.1802" x="106.6042" y="2017.5794">on top of those calls.</text></g><!--entity UserA--><g class="entity" data-qualified-name="UserA" data-source-line="29" id="ent0002"><ellipse cx="228.0787" cy="164.1983" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M228.0787,172.1983 L228.0787,199.1983 M215.0787,180.1983 L241.0787,180.1983 M228.0787,199.1983 L215.0787,214.1983 M228.0787,199.1983 L241.0787,214.1983" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.4541" x="184.6842" y="229.2334">User A</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.7891" x="184.6842" y="245.7217">(Your Phone)</text></g><!--entity UserB--><g class="entity" data-qualified-name="UserB" data-source-line="30" id="ent0003"><ellipse cx="426.081" cy="1936.3983" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M426.081,1944.3983 L426.081,1971.3983 M413.081,1952.3983 L439.081,1952.3983 M426.081,1971.3983 L413.081,1986.3983 M426.081,1971.3983 L439.081,1986.3983" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.8477" x="372.0942" y="2001.4334">User B</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.9736" x="372.0942" y="2017.9217">(Friend's Phone)</text></g><g class="entity" data-qualified-name="N1" data-source-line="121" id="ent0035"><path d="M306.3942,50.9883 L306.3942,353.377 A7.5,7.5 0 0 0 313.8942,360.877 L784.2633,360.877 A7.5,7.5 0 0 0 791.7633,353.377 L791.7633,53.4883 L781.7633,43.4883 L313.8942,43.4883 A7.5,7.5 0 0 0 306.3942,50.9883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M781.7633,43.4883 L781.7633,49.7383 A3.75,3.75 0 0 0 785.5133,53.4883 L791.7633,53.4883 L781.7633,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="146.9688" x="312.3942" y="62.0234">&#127919; THE BIG PICTURE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="312.3942" y="77.5449">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.2261" x="312.3942" y="92.8555">Problem this SDK solves:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.9336" x="312.3942" y="108.166">During a regular phone call, you can only send voice/video.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="464.3691" x="312.3942" y="123.4766">What if you want to send OTHER data? (menu, game moves, AR data, etc.)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="312.3942" y="138.7871">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.043" x="312.3942" y="154.0977">Solution:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.7129" x="312.3942" y="169.4082">1. Your phone is on a 5G call (voice + video flowing)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.2866" x="312.3942" y="184.7188">2. SDK creates a DATA CHANNEL (separate pipe for app data)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.083" x="312.3942" y="200.0293">3. Mini app can now send JSON, files, game data, etc.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.0337" x="312.3942" y="215.3398">4. All happening DURING THE SAME CALL!</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="312.3942" y="230.6504">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="138.5313" x="312.3942" y="245.9609">Real-world example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.1528" x="312.3942" y="261.2715">&#8226; You call a restaurant</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.3608" x="312.3942" y="276.582">&#8226; During the call, a menu mini-app opens</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7109" x="312.3942" y="291.8926">&#8226; You tap items on the menu</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.6172" x="312.3942" y="307.2031">&#8226; The data (your order) sends through DATA CHANNEL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.3936" x="312.3942" y="322.5137">&#8226; Restaurant sees your order in real-time</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.5371" x="312.3942" y="337.8242">&#8226; You confirm verbally via VOICE CHANNEL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.8135" x="312.3942" y="353.1348">&#8226; All in one call!</text></g><!--link UserA to MiniApp--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="82" id="lnk22"><path d="M228.0742,249.0683 C228.0742,314.9483 228.0742,431.6383 228.0742,515.5383" fill="none" id="UserA-to-MiniApp" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="228.0742,521.5383,232.0742,512.5383,228.0742,516.5383,224.0742,512.5383,228.0742,521.5383" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.6069" x="230.7182" y="404.4466">1. User taps</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.895" x="229.0742" y="419.7572">"Send Menu"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.0278" x="247.5078" y="435.0677">button</text></g><!--link MiniApp to Bridge--><g class="link" data-entity-1="ent0005" data-entity-2="ent0010" data-link-type="dependency" data-source-line="84" id="lnk23"><path d="M123.0742,658.1383 C93.4242,676.6383 64.7342,701.1183 48.0742,732.2683 C22.2342,780.6083 58.1333,824.5998 104.0133,859.5898" fill="none" id="MiniApp-to-Bridge" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="108.7842,863.2283,104.0535,854.59,104.8084,860.1962,99.2022,860.9512,108.7842,863.2283" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.0913" x="63.4453" y="745.8366">2. Mini app calls:</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.8335" x="49.0742" y="761.1472">createDataChannel()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.728" x="54.1269" y="776.4577">(JavaScript function)</text></g><!--link MiniApp to Bridge--><g class="link" data-entity-1="ent0005" data-entity-2="ent0010" data-link-type="dependency" data-source-line="98" id="lnk30"><path d="M220.2642,700.6983 C215.6542,753.0183 210.4904,811.6614 206.5104,856.8714" fill="none" id="MiniApp-to-Bridge-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="205.9842,862.8483,210.758,854.2337,206.4227,857.8675,202.7888,853.5322,205.9842,862.8483" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.2446" x="225.8399" y="753.3366">9. User sends menu:</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="144.936" x="217.9942" y="768.6472">sendData(menu_json)</text></g><!--link Bridge to Managers--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" data-source-line="86" id="lnk24"><path d="M127.5542,975.9883 C111.8742,994.5983 102.7542,1016.1383 113.0742,1037.7083 C118.2142,1048.4483 121.2356,1053.8738 129.3256,1062.8838" fill="none" id="Bridge-to-Managers" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="133.3342,1067.3483,130.2976,1057.9792,129.9937,1063.6279,124.345,1063.324,133.3342,1067.3483" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.5103" x="114.0742" y="1019.2766">3. SDK translates</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.6069" x="117.0258" y="1034.5872">to Android code</text></g><!--link Bridge to Managers--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" data-source-line="100" id="lnk31"><path d="M219.6042,975.9483 C222.2342,985.7583 224.5542,995.9583 226.0742,1005.7083 C229.1842,1025.6283 230.3345,1041.5291 230.6645,1061.3891" fill="none" id="Bridge-to-Managers-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="230.7642,1067.3883,234.6141,1058.3231,230.6811,1062.389,226.6152,1058.456,230.7642,1067.3883" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.1548" x="230.4542" y="1026.7766">10. Forward data</text></g><!--link Managers to Modem--><g class="link" data-entity-1="ent0011" data-entity-2="ent0013" data-link-type="dependency" data-source-line="88" id="lnk25"><path d="M226.7942,1197.0983 C226.4942,1207.6383 226.2342,1218.4483 226.0742,1228.6383 C225.4842,1266.4483 225.7367,1302.0392 226.3867,1338.3192" fill="none" id="Managers-to-Modem" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="226.4942,1344.3183,230.3323,1335.2481,226.4046,1339.3191,222.3336,1335.3914,226.4942,1344.3183" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.9434" x="227.0742" y="1242.2066">4. SDK tells modem:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="288.9892" y="1257.5172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.8291" x="94.6717" y="1318.6285">Create a data tunnel</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.3838" x="99.3944" y="1333.9391">to the other phone</text></g><!--link Modem to Managers--><g class="link" data-entity-1="ent0013" data-entity-2="ent0011" data-link-type="dependency" data-source-line="94" id="lnk28"><path d="M142.0242,1344.2583 C124.0242,1318.7683 107.6442,1290.0983 98.0742,1260.6383 C90.2342,1236.4983 95.9619,1219.3485 113.2119,1201.1885" fill="none" id="Modem-to-Managers" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="117.3442,1196.8383,108.2457,1200.6088,113.9007,1200.4635,114.046,1206.1185,117.3442,1196.8383" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.498" x="99.0742" y="1242.2066">7. Modem notifies:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="156.2666" y="1257.5172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3198" x="6" y="1217.3167">Channel ready!</text></g><!--link Managers to Modem--><g class="link" data-entity-1="ent0011" data-entity-2="ent0013" data-link-type="dependency" data-source-line="102" id="lnk32"><path d="M343.9842,1197.0483 C362.8742,1215.8083 372.4842,1237.5383 359.0742,1260.6383 C355.4842,1266.8383 350.3242,1263.7683 345.0742,1268.6383 C321.5542,1290.5083 303.692,1313.009 286.052,1339.589" fill="none" id="Managers-to-Modem-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="282.7342,1344.5883,291.0437,1339.3013,285.499,1340.4223,284.378,1334.8776,282.7342,1344.5883" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.751" x="366.3042" y="1242.2066">11. Send through</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.5581" x="380.9006" y="1257.5172">data channel</text></g><!--link Modem to Network--><g class="link" data-entity-1="ent0013" data-entity-2="ent0018" data-link-type="dependency" data-source-line="90" id="lnk26"><path d="M130.5142,1502.7283 C92.4142,1533.9883 61.8442,1574.8183 80.0742,1618.5283 C93.3942,1650.4383 112.9638,1674.868 137.8238,1698.138" fill="none" id="Modem-to-Network" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="142.2042,1702.2383,138.3671,1693.1676,138.5538,1698.8214,132.9001,1699.0082,142.2042,1702.2383" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0508" x="81.0742" y="1585.0966">5. Modem sends</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.1338" x="82.0327" y="1600.4072">request through</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.8203" x="96.6894" y="1615.7177">5G network</text></g><!--link Network to Modem--><g class="link" data-entity-1="ent0018" data-entity-2="ent0013" data-link-type="dependency" data-source-line="92" id="lnk27"><path d="M307.4342,1702.0483 C330.5142,1678.4883 352.8442,1649.8283 365.0742,1618.5283 C372.6842,1599.0683 376.7942,1588.8183 365.0742,1571.5283 C359.7142,1563.5983 353.0242,1568.8683 345.0742,1563.5283 C334.7242,1556.5583 329.0839,1552.4859 319.3639,1543.9559" fill="none" id="Network-to-Modem" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="314.8542,1539.9983,318.9804,1548.9411,318.6123,1543.2963,324.2571,1542.9282,314.8542,1539.9983" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.521" x="374.8129" y="1592.5966">6. Network confirms</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.3584" x="373.3942" y="1607.9072">data channel created</text></g><!--link Modem to Network--><g class="link" data-entity-1="ent0013" data-entity-2="ent0018" data-link-type="dependency" data-source-line="104" id="lnk33"><path d="M223.2442,1539.8483 C222.7642,1550.5283 222.3542,1561.2583 222.0742,1571.5283 C220.8942,1615.0883 222.3472,1658.1372 224.4172,1696.0672" fill="none" id="Modem-to-Network-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="224.7442,1702.0583,228.2478,1692.8537,224.4717,1697.0657,220.2597,1693.2896,224.7442,1702.0583" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.9546" x="223.0742" y="1600.0966">12. Transmit over 5G</text></g><!--link Managers to MiniApp--><g class="link" data-entity-1="ent0011" data-entity-2="ent0005" data-link-type="dependency" data-source-line="96" id="lnk29"><path d="M324.0542,1067.4883 C332.6242,1058.4083 340.2542,1048.4583 346.0742,1037.7083 C518.0942,720.2783 408.6142,786.7383 371.0742,732.2683 C365.4142,724.0483 358.5742,729.5283 350.0742,724.2683 C338.8242,717.3083 332.3485,712.9775 321.6285,704.3975" fill="none" id="Managers-to-MiniApp" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="316.9442,700.6483,321.4712,709.395,320.8478,703.7726,326.4702,703.1492,316.9442,700.6483" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.6367" x="441.0642" y="917.0566">8. SDK tells mini app:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="506.8259" y="932.3672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.104" x="172.2128" y="720.9645">You can send data now</text></g><!--link Network to UserB--><g class="link" data-entity-1="ent0018" data-entity-2="ent0003" data-link-type="dependency" data-source-line="106" id="lnk34"><path d="M290.3342,1831.8483 C320.0342,1862.8283 350.8916,1894.9874 377.9116,1923.1674" fill="none" id="Network-to-UserB" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="382.0642,1927.4983,378.7226,1918.2336,378.6037,1923.8892,372.9481,1923.7704,382.0642,1927.4983" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.8389" x="346.2242" y="1875.0266">13. Delivered to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.6128" x="351.3372" y="1890.3372">friend's phone</text></g><g class="legend" data-source-line="109"><rect fill="none" height="129.418" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="670.3174" x="57.223" y="2059.3183"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="58.7139" x="66.8372" y="2079.8534">Concept</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="137.2998" x="205.5452" y="2079.8534">Simple Explanation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="62.223" y="2096.3417">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="64.4834" x="66.6527" y="2096.3417">Mini App</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="131.1361" y="2096.3417">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="512.75" x="205.3607" y="2096.3417">Web app (HTML/JS) that runs during a call. Like a browser tab, but for calls.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="62.223" y="2112.83">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="129.8486" x="66.6527" y="2112.83">SDK (This Project)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="196.5013" y="2112.83">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="481.0791" x="205.3607" y="2112.83">The software that lets mini apps talk to 5G hardware. Like a translator.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="62.223" y="2129.3183">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="96.3936" x="66.6527" y="2129.3183">Data Channel</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="163.0462" y="2129.3183">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="468.6377" x="205.3607" y="2129.3183">A "tunnel" for sending data during a call (separate from voice/video).</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="62.223" y="2145.8066">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="124.9541" x="66.6527" y="2145.8066">Terminal/Modem</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="191.6068" y="2145.8066">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335.6309" x="205.3607" y="2145.8066">The 5G chip in your phone. It talks to cell towers.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="62.223" y="2162.2948">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="90.8428" x="66.6527" y="2162.2948">IMS Network</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="157.4954" y="2162.2948">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="509.8789" x="205.3607" y="2162.2948">Internet-based phone system. Handles calls over 5G data (not old cellular).</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="62.223" y="2178.7831">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="34.1934" x="66.6527" y="2178.7831">AIDL</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="100.846" y="2178.7831">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="484.3398" x="205.3607" y="2178.7831">Android Interface Definition Language - how SDK talks to modem chip.</text><line style="stroke:#000000;stroke-width:1;" x1="62.223" x2="722.5404" y1="2066.3183" y2="2066.3183"/><line style="stroke:#000000;stroke-width:1;" x1="62.223" x2="722.5404" y1="2082.8066" y2="2082.8066"/><line style="stroke:#000000;stroke-width:1;" x1="62.223" x2="722.5404" y1="2099.2948" y2="2099.2948"/><line style="stroke:#000000;stroke-width:1;" x1="62.223" x2="722.5404" y1="2115.7831" y2="2115.7831"/><line style="stroke:#000000;stroke-width:1;" x1="62.223" x2="722.5404" y1="2132.2714" y2="2132.2714"/><line style="stroke:#000000;stroke-width:1;" x1="62.223" x2="722.5404" y1="2148.7597" y2="2148.7597"/><line style="stroke:#000000;stroke-width:1;" x1="6