0" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.8896" x="99.3442" y="1183.6848">- CallManager: Monitors call</text></g><!--entity Modem--><g class="entity" data-qualified-name=". TERMINAL LAYER.n.Your Phone.s 5G Hardware..Modem" data-source-line="54" id="ent0013"><rect fill="#FFFFE0" height="194.8828" rx="7.5" ry="7.5" style="stroke:#FFA500;stroke-width:0.5;" width="196.3037" x="130.9242" y="1344.6383"/><rect fill="#FFFFE0" height="10" style="stroke:#FFA500;stroke-width:0.5;" width="15" x="307.2279" y="1349.6383"/><rect fill="#FFFFE0" height="2" style="stroke:#FFA500;stroke-width:0.5;" width="4" x="305.2279" y="1351.6383"/><rect fill="#FFFFE0" height="2" style="stroke:#FFA500;stroke-width:0.5;" width="4" x="305.2279" y="1355.6383"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="32.252" x="207.9501" y="1378.1734">&#171;5g&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.0879" x="145.9242" y="1394.6617">Modem/Chipset</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="145.9242" y="1411.15">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.1875" x="145.9242" y="1427.6383">The physical chip that</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156.3037" x="145.9242" y="1444.1266">connects to 5G towers.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="145.9242" y="1460.6148">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.9326" x="145.9242" y="1477.1031">Handles:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.3242" x="145.9242" y="1493.5914">&#10003; Voice call</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.9648" x="145.9242" y="1510.0797">&#10003; Video call</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.4297" x="145.9242" y="1526.568">&#10003; Data channel (NEW!)</text></g><g class="entity" data-qualified-name=". TERMINAL LAYER.n.Your Phone.s 5G Hardware..GMN14" data-source-line="57" id="ent0015"><path d="M362.5942,1398.6483 L362.5942,1438.0883 L327.6242,1442.0883 L362.5942,1446.0883 L362.5942,1485.5116 A7.5,7.5 0 0 0 370.0942,1493.0116 L564.0673,1493.0116 A7.5,7.5 0 0 0 571.5673,1485.5116 L571.5673,1401.1483 L561.5673,1391.1483 L370.0942,1391.1483 A7.5,7.5 0 0 0 362.5942,1398.6483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M561.5673,1391.1483 L561.5673,1397.3983 A3.75,3.75 0 0 0 565.3173,1401.1483 L571.5673,1401.1483 L561.5673,1391.1483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="131.7202" x="368.5942" y="1408.7166">Think of it like this:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="368.5942" y="1424.0272">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.4966" x="368.5942" y="1439.3377">Old calls = only voice/video</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="368.5942" y="1454.6483">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.9731" x="368.5942" y="1469.9588">5G New Calling = voice/video</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.2788" x="368.5942" y="1485.2694">PLUS data channel for apps</text></g><!--entity Network--><